<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tailwind Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&display=swap">
<style>
/* Layout: topic index left; workbench right = class switches (left) + device-scaled preview and live HTML (right). Same blue theme as Tag Finder. */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#15202d; --muted:#586577; --line:#d6dde6;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e3edfb; --mark:#ffe27a; --warn:#b4361f; --warn-soft:#fbe9e5; --ok:#15803d; --ok-soft:#dcfce7;
  --code-bg:#0f1b2b; --c-text:#e2e8f0; --c-tag:#7dd3fc; --c-attr:#fcd98a; --c-cls:#93c5fd; --c-new:#fde047; --c-dim:#7b8ba1; --c-sel:#93c5fd; --c-prop:#f9a8d4; --c-val:#a7f3d0;
  --display:"Recursive",ui-rounded,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --mono:"Recursive",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131b; --panel:#141d28; --ink:#e4ebf3; --muted:#95a3b5; --line:#263345;
  --accent:#6ea8ff; --accent-ink:#0b1320; --accent-soft:#1a2a42; --mark:#8a7419; --warn:#ff9a85; --warn-soft:#3a1f1a; --ok:#4ade80; --ok-soft:#12301f;
  --code-bg:#09111b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131b; --panel:#141d28; --ink:#e4ebf3; --muted:#95a3b5; --line:#263345;
  --accent:#6ea8ff; --accent-ink:#0b1320; --accent-soft:#1a2a42; --mark:#8a7419; --warn:#ff9a85; --warn-soft:#3a1f1a; --ok:#4ade80; --ok-soft:#12301f;
  --code-bg:#09111b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-variation-settings:"MONO" 1;background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:.9em}

.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:18px 14px;padding-inline:16px;max-width:1480px;margin:0 auto}
.brand{font-family:var(--display);font-variation-settings:"CASL" 1;font-weight:800;font-size:1.6rem;margin:0;display:flex;align-items:center;gap:10px}
.brand .wave{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:1rem}
.topbar p{margin:0;color:var(--muted);flex:1 1 280px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.browse-btn{display:none}
.topics{overflow:auto;padding-right:4px;padding-bottom:20px;flex:1}
.group h3{font-family:var(--display);font-variation-settings:"CASL" 1;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px;display:flex;justify-content:space-between}
.topic{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:.95rem}
.topic:hover{background:var(--accent-soft)}
.topic[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.topic .t{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.72rem;opacity:.7;white-space:nowrap}
.special{background:var(--code-bg);color:var(--c-cls);font-weight:700;margin-bottom:6px}
.special:hover{background:var(--code-bg);filter:brightness(1.25)}
.special[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);padding:10px}

main{min-width:0}
.head{margin-bottom:16px}
.eyebrow{font-family:var(--display);font-variation-settings:"CASL" 1;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.head h2{font-family:var(--display);font-variation-settings:"CASL" .6;font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.head h2 .iw{color:var(--muted);font-weight:500}
.lead{color:var(--muted);margin:8px 0 0;max-width:72ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--display);font-variation-settings:"CASL" .4;font-size:1.05rem;font-weight:700;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.9rem;flex:none}
.step-h .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--mono);font-variation-settings:"MONO" 1;font-weight:700;font-size:.95rem;padding:3px 10px;border-radius:8px;background:var(--code-bg);color:var(--c-cls)}
.why p{margin:0 0 8px}
.why p:last-child{margin-bottom:0}

.btn-s{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:8px;font-size:.85rem}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{border:0;background:var(--accent);color:var(--accent-ink);padding:8px 15px;border-radius:8px;font-weight:700;font-size:.92rem}
.btn-p:hover{filter:brightness(1.08)}
.btn-p:disabled{opacity:.45;cursor:default;filter:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-align:left}
.linkbtn:hover{text-decoration:underline}

.rows{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:center;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}
.row:hover{border-color:var(--accent)}
.row.on{background:var(--accent-soft);border-color:var(--accent)}
.row .cls{font-family:var(--mono);font-variation-settings:"MONO" 1;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.row .on-el{font-weight:400;font-size:.75rem;color:var(--muted);font-family:var(--body)}
.row .css{grid-column:2;font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.8rem;color:var(--muted)}
.row .fx{grid-column:2;font-size:.88rem}
.row:not(.on) .fx{color:var(--muted)}
.row.on .fx::before{content:"✓ ";color:var(--accent);font-weight:700}
.row:not(.on) .fx::before{content:"→ "}
.sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;cursor:pointer;margin:0;grid-row:span 3;transition:background .15s}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::before{transform:translateX(16px)}
select.vsel{font:inherit;font-family:var(--mono);font-variation-settings:"MONO" 1;font-weight:700;font-size:.9rem;padding:2px 4px;border:1.5px solid var(--accent);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
.progress{font-size:.86rem;color:var(--muted);margin:0 0 10px}
.fixednote{font-size:.85rem;color:var(--muted);margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.fixednote code{background:transparent;padding:0}

pre.code{margin:0;background:var(--code-bg);color:var(--c-text);border-radius:10px;padding:14px;font-size:.88rem;line-height:1.6;overflow-x:auto;font-family:var(--mono);font-variation-settings:"MONO" 1;white-space:pre}
.k-tag{color:var(--c-tag)} .k-at{color:var(--c-attr)} .k-cls{color:var(--c-cls)} .k-dim{color:var(--c-dim)} .k-sel{color:var(--c-sel)} .k-prop{color:var(--c-prop)} .k-val{color:var(--c-val)}
mark.k-new{background:var(--c-new);color:#1a1a1a;border-radius:3px;padding:0 2px}

.browser{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1.5px solid var(--line);background:var(--bg);flex-wrap:wrap}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.url{flex:1;min-width:90px;font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.78rem;color:var(--muted);background:var(--panel);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:3px 10px;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vp{position:relative;overflow:hidden;background:#e9edf2}
.vp iframe{display:block;border:0;background:#fff;transform-origin:0 0}
.devnote{margin:0;padding:8px 12px;font-size:.84rem;border-top:1.5px solid var(--line);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bp{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.75rem;padding:1px 7px;border-radius:20px;background:var(--bg);color:var(--muted)}
.bp.on{background:var(--accent);color:var(--accent-ink)}

.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{padding:9px 12px;border-radius:8px;background:var(--warn-soft);font-size:.93rem}
.tips li b{color:var(--warn)}
.xr-topics{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.pager button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;text-align:left;max-width:48%;min-width:0}
.pager button:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:.78rem}

/* cheat sheet */
.cheat-search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;margin-bottom:12px}
.cheat-search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tablewrap{overflow-x:auto}
table.cheat{border-collapse:collapse;width:100%;font-size:.93rem}
table.cheat th,table.cheat td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.cheat th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.cheat td.m{font-family:var(--mono);font-variation-settings:"MONO" 1;white-space:nowrap}
table.cheat td.tw{color:var(--accent);font-weight:700}
table.cheat tr.grp td{background:var(--bg);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* practice */
.who{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0}
.field label,.edl{font-weight:700;font-size:.9rem}
.edl{display:block;margin:12px 0 6px}
.field input{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.who .hint{flex-basis:100%;margin:0}
.hint{font-size:.86rem;color:var(--muted);margin:8px 0 0}
.settabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.settab{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.settab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cnt{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.8rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.cnt.full{color:var(--ok);font-weight:700}
.chnav{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:14px}
.chgrp{display:flex;flex-direction:column;gap:4px}
.chg{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.chnums{display:flex;gap:6px}
.task ul{margin:6px 0 0;padding-left:20px}
.task li{margin-bottom:3px}
.pronote{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--mark);color:var(--ink)}
.settab.pro{border-style:dashed}
.chn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.chn.done{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.chn[aria-current="true"]{outline:3px solid var(--accent);outline-offset:2px}
.ch-title{font-family:var(--display);font-variation-settings:"CASL" .5;font-size:1.3rem;margin:0 0 6px}
.task{margin:0 0 8px;font-size:1.02rem}
textarea.code{width:100%;min-height:190px;resize:vertical;background:var(--code-bg);color:var(--c-text);border:0;border-radius:10px;padding:14px;font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.92rem;line-height:1.55;white-space:pre;overflow:auto;tab-size:2}
.pbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hintbox{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--mark);color:var(--ink);font-size:.93rem}
.fb{margin-top:10px;font-weight:700;border-radius:8px}
.fb:empty{display:none}
.fb.ok{color:var(--ok);background:var(--ok-soft);padding:10px 12px}
.fb.bad{color:var(--warn);background:var(--warn-soft);padding:10px 12px}
.fb.wait{color:var(--muted);background:var(--bg);padding:10px 12px}
.blabel{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.blabel.goal{background:var(--ok);color:var(--panel)}
.codecard{margin-top:20px}
.pbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:10px}
.codebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.codeval{font-family:var(--mono);font-variation-settings:"MONO" 1;font-weight:800;font-size:1.6rem;letter-spacing:.06em;padding:8px 14px;border:2px dashed var(--accent);border-radius:10px;user-select:all}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.offscreen{position:absolute;left:-12000px;top:0;border:0;height:900px}

@media (max-width:1180px){.bench{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .browse-btn{display:flex;justify-content:space-between;align-items:center;width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700}
  .topics{display:none;max-height:60vh;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:6px}
  .side.open .topics,.side.searching .topics{display:block}
  .pager button{max-width:100%;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sidetoggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:.88rem;font-weight:700}
.sidetoggle:hover{border-color:var(--accent);color:var(--accent)}
.app.noside{grid-template-columns:minmax(0,1fr)}
.app.noside .side{display:none}
@media (max-width:860px){.sidetoggle{display:none}.app.noside .side{display:flex}}
</style>
</head>
<body>


<header class="topbar">
  <h1 class="brand"><span class="wave">tw</span> Tailwind Lab</h1>
  <p>Add Tailwind classes one at a time, see the CSS each one means, and watch the page change on phone, tablet and laptop.</p>

  <button class="sidetoggle" id="sidetoggle" aria-controls="side" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span>Hide topics</span></button>
</header>

<div class="app">
  <aside class="side" id="side">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search: padding, flex, hover…" aria-label="Search topics">
    </div>
    <button class="browse-btn" id="browse" aria-expanded="false"><span>Browse all topics</span><span id="count"></span></button>
    <nav class="topics" id="topics" aria-label="Topics"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TW_SRC='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js';
const DEV={phone:375,tablet:768,laptop:1024};

const GROUPS=[
 {id:'start',name:'Start here'},
 {id:'text',name:'Text'},
 {id:'space',name:'Spacing & size'},
 {id:'color',name:'Colors, borders & shadows'},
 {id:'flex',name:'Flexbox'},
 {id:'grid',name:'Grid'},
 {id:'pos',name:'Position'},
 {id:'resp',name:'Responsive (phone → laptop)'},
 {id:'states',name:'Hover & focus'},
 {id:'comp',name:'Build CampusKart parts'}
];

/* row = [element key, class, CSS it means, what changes, options?]  options = [[class, css, what changes], …] */
const FLEX3=`<div class="{{c}}">
  <div class="{{x}}">1</div>
  <div class="{{x}}">2</div>
  <div class="{{x}}">3</div>
</div>`;
const BOXX='bg-blue-600 text-white font-bold px-5 py-3 rounded';
const FRAME='border-2 border-dashed border-gray-400 p-2';

const ITEMS=[
/* ---------- START ---------- */
{id:'how',g:'start',t:'How Tailwind works',goal:'style a button with Tailwind',
why:`<p>In normal CSS you write rules in a separate file. In Tailwind you add small ready-made <b>classes</b> directly in the HTML.</p><p>Each class does <b>one job</b>, like one line of CSS. <code>bg-blue-600</code> = <code>background-color: blue</code>. Turn on the classes below one by one and watch the HTML and the button change.</p>`,
html:`<button class="{{b}}">Add to cart</button>`,
rows:[['b','bg-blue-600','background-color: #2563eb','Blue background'],['b','text-white','color: #fff','White text'],['b','px-5','padding-left: 20px; padding-right: 20px','Space on the left and right'],['b','py-2','padding-top: 8px; padding-bottom: 8px','Space on the top and bottom'],['b','rounded-lg','border-radius: 8px','Round corners'],['b','font-semibold','font-weight: 600','Text becomes semi-bold'],['b','shadow-md','box-shadow: 0 4px 6px …','Soft shadow below'],['b','hover:bg-blue-800','on hover → background-color: #1e40af','Darker blue when the mouse is over it']],
tips:['A typo in a class name. Tailwind silently ignores classes it does not know, so nothing happens and there is no error.','Two classes that fight, like <code>text-left</code> and <code>text-center</code> on the same element.']},

{id:'setup',g:'start',t:'Add Tailwind to a page',goal:'add Tailwind to my HTML page',
why:`<p>For practice, one <code>&lt;script&gt;</code> line in the <code>head</code> is enough. After that, every Tailwind class works in that page.</p><p>Real projects install Tailwind with npm and a build tool (you will see this with React later). The classes are the same.</p><p>Tailwind removes the browser's default styles, so an <code>h1</code> looks like normal text until you add classes.</p>`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusKart</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>
</head>
<body>
  <h1 class="{{h}}">Tailwind is working!</h1>
  <p>This h1 has no default size. Add classes to style it.</p>
</body>
</html>`,
html:`<h1 class="{{h}}">Tailwind is working!</h1>
<p>This h1 has no default size. Add classes to style it.</p>`,
rows:[['h','text-4xl','font-size: 36px','Heading becomes big'],['h','font-bold','font-weight: 700','Heading becomes bold'],['h','text-blue-600','color: blue-600','Heading turns blue']],
tips:['Forgetting the script line. The classes stay in the HTML but nothing is styled.','Expecting h1 to be big by default. Tailwind resets all default styles.']},

/* ---------- SPACING & SIZE ---------- */
{id:'scale',g:'space',t:'The spacing scale',goal:'understand what p-4 or m-8 means',
why:`<p>Tailwind numbers are steps of <b>4px</b>. <code>1</code> = 4px, <code>2</code> = 8px, <code>4</code> = 16px, <code>8</code> = 32px. So <code>p-4</code> = padding 16px.</p><p>The same numbers work for padding (<code>p-</code>), margin (<code>m-</code>), gap (<code>gap-</code>), width (<code>w-</code>) and height (<code>h-</code>).</p>`,

tips:['Thinking <code>p-4</code> means 4px. It means 4 × 4 = 16px.']},

{id:'sides',g:'space',t:'Padding on some sides',goal:'add padding only on some sides',

html:`<button class="{{b}}">Shop now</button>`,fixed:{b:'bg-blue-600 text-white rounded-lg'},

tips:['Writing <code>p-x-6</code>. It is <code>px-6</code>.']},

<div class="{{d}}">Box</div>

/* ---------- FLEXBOX ---------- */
{id:'flex',g:'flex',t:'flex & direction',goal:'put boxes side by side with Tailwind',
why:`<p><code>flex</code> on the <b>parent</b> = <code>display: flex</code>. Its children sit in a row.</p><p><code>flex-col</code> stacks them top to bottom. <code>flex-row</code> is the default row.</p>`,

function hook(f){let d;try{d=f.contentDocument;}catch(e){return;}if(!d)return;
  d.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a');if(!a)return;e.preventDefault();toast('This link would open: '+(a.getAttribute('href')||''));});
  d.addEventListener('submit',e=>{e.preventDefault();toast('Form submitted (demo only).');});}

/* ---------- device-scaled preview ---------- */
function devBar(){return `<div class="seg" role="group" aria-label="Screen size">${['phone','tablet','laptop'].map(d=>`<button data-dev="${d}" aria-pressed="${state.device===d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div>`;}
function devNote(){const w=DEV[state.device];return `<span>${w}px wide ·</span>${[['sm',640],['md',768],['lg',1024],['xl',1280]].map(([n,px])=>`<span class="bp ${w>=px?'on':''}">${n}: ${w>=px?'on':'off'}</span>`).join('')}`;}
function layoutFrame(f,vp,maxH){
  if(!f||!vp)return;const W=DEV[state.device];const cw=vp.clientWidth||600;const sc=Math.min(1,cw/W);
  f.style.width=W+'px';let h=220;try{const d=f.contentDocument;f.style.height='100px';h=d.documentElement.scrollHeight;}catch(e){}
  h=Math.min(Math.max(h,180),maxH||900);f.style.height=h+'px';f.style.transform=`scale(${sc})`;f.style.marginLeft=Math.max(0,(cw-W*sc)/2)+'px';vp.style.height=Math.ceil(h*sc)+'px';
}
function bindDevices(after){document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{state.device=b.dataset.dev;document.querySelectorAll('[data-dev]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.dev===state.device));document.querySelectorAll('.devnote').forEach(n=>n.innerHTML=devNote());after();});}

/* ---------- sidebar ---------- */
function renderTopics(filter){
  const q=(filter||'').trim().toLowerCase();let html='';
  if(!q){const done=allChallenges().filter(c=>PS.solved[c.id]).length;
    html+=`<button class="topic special" data-id="practice" aria-current="${state.id==='practice'}"><span>Practice</span><span class="t">${done}/${allChallenges().length} done</span></button><button class="topic special" data-id="cheat" aria-current="${state.id==='cheat'}"><span>CSS → Tailwind</span><span class="t">lookup</span></button>`;}
  GROUPS.forEach(g=>{
    const items=ITEMS.filter(i=>i.g===g.id&&(!q||(i.t+' '+i.goal+' '+i.rows.map(r=>r[1]+' '+r[2]+' '+(r[4]||[]).map(o=>o[0]+' '+o[1]).join(' ')).join(' ')).toLowerCase().includes(q)));
    if(!items.length)return;
    html+=`<div class="group"><h3><span>${g.name}</span><span>${items.length}</span></h3>`+items.map(i=>`<button class="topic" data-id="${i.id}" aria-current="${i.id===state.id}"><span>${esc(i.t)}</span></button>`).join('')+'</div>';
  });
  $('#topics').innerHTML=html||`<p class="empty">No topic found for “${esc(q)}”. Try the CSS → Tailwind lookup.</p>`;
  $('#count').textContent=ITEMS.length+' topics';$('#side').classList.toggle('searching',!!q);
}
$('#topics').addEventListener('click',e=>{const b=e.target.closest('.topic');if(b)open(b.dataset.id,true);});
$('#q').addEventListener('input',e=>renderTopics(e.target.value));
$('#browse').addEventListener('click',()=>{const s=$('#side');const o=!s.classList.contains('open');s.classList.toggle('open',o);$('#browse').setAttribute('aria-expanded',o);});
function afterOpen(fromClick){renderTopics($('#q').value);if(fromClick){$('#side').classList.remove('open');$('#browse').setAttribute('aria-expanded','false');if(window.innerWidth<=860)$('#main').scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});}}

/* ---------- topic view ---------- */
function open(id,fromClick){
  if(id==='practice'){openPractice(fromClick);return;}
  if(id==='cheat'){openCheat(fromClick);return;}
  const it=byId(id)||ITEMS[0];state.id=it.id;state.last=null;
  try{history.replaceState(null,'','#'+it.id);}catch(e){}
  const g=GROUPS.find(x=>x.id===it.g);const idx=ITEMS.indexOf(it);const prev=ITEMS[idx-1],next=ITEMS[idx+1];
  const fixedList=it.fixed?Object.values(it.fixed).join(' '):'';
  const prac=allChallenges().filter(c=>c.topic===it.id);
  $('#main').innerHTML=`
  <div class="head"><div class="eyebrow">${g.name}</div><h2><span class="iw">I want to</span> ${esc(it.goal)}</h2></div>
  <div class="bench">
    <div class="col">
      <section class="card"><div class="chips">${it.rows.map((r,i)=>`<span class="chip">${esc(rowInfo(it,i).cls)}</span>`).filter((v,i,a)=>a.indexOf(v)===i).join('')}</div><div class="why">${it.why}</div></section>
      <section class="card"><h3 class="step-h"><span class="num">1</span>Add classes one at a time<span class="right"><button class="btn-s" id="none">Start over</button><button class="btn-s" id="all">All on</button></span></h3>
        ${fixedList?`<p class="fixednote">Already added so you can see it: <code>${esc(fixedList)}</code></p>`:''}
        <p class="progress" id="progress"></p>
        <ul class="rows" id="rows"></ul>
        <div class="pbtns"><button class="btn-p" id="next">Add next class</button></div>
      </section>
      ${prac.length?`<section class="card"><h3 class="step-h">Practice this</h3><div class="xr-topics">${prac.map(c=>`<button class="btn-s" data-practice="${c.id}">${PS.solved[c.id]?'✓ ':''}${esc(c.t)} →</button>`).join('')}</div></section>`:''}
      ${it.tips?`<section class="card"><h3 class="step-h">Watch out</h3><ul class="tips">${it.tips.map(t=>`<li><b>Mistake:</b> ${t}</li>`).join('')}</ul></section>`:''}
    </div>
    <div class="col sticky">
      <section class="card" style="padding:0;border:0;background:transparent">
        <h3 class="step-h"><span class="num">2</span>See the result</h3>
        <div class="browser"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">index.html</div>${devBar()}</div>
          <div class="vp" id="vp"><iframe id="pv" sandbox="allow-scripts allow-same-origin" title="Result preview"></iframe></div>
          <p class="devnote">${devNote()}</p></div>
      </section>
      <section class="card"><h3 class="step-h"><span class="num">3</span>Your HTML<span class="right"><button class="btn-s" id="copy">Copy</button></span></h3>
        <pre class="code" id="code"></pre>
        <p class="hint">New class is <mark class="k-new">highlighted</mark>. In Tailwind, all the styling lives in the class attribute.</p></section>
    </div>
  </div>
  <div class="pager">${prev?`<button data-go="${prev.id}"><small>← Previous</small>${esc(prev.t)}</button>`:'<span></span>'}${next?`<button data-go="${next.id}" style="text-align:right"><small>Next →</small>${esc(next.t)}</button>`:''}</div>`;
  renderRows(it);
  const f=$('#pv');f.onload=()=>{hook(f);setTimeout(()=>layoutFrame(f,$('#vp'),it.maxH),120);setTimeout(()=>layoutFrame(f,$('#vp'),it.maxH),500);};
  f.srcdoc=docFor(fill(it,it.html));
  updateCode(it);
  bindDevices(()=>layoutFrame($('#pv'),$('#vp'),it.maxH));
  const on=onList(it);
  $('#rows').addEventListener('change',e=>{const i=+e.target.dataset.i;
    if(e.target.classList.contains('vsel')){valList(it)[i]=e.target.value;on[i]=true;const r=rowInfo(it,i);const li=e.target.closest('.row');li.querySelector('.css').textContent=r.css;li.querySelector('.fx').textContent=r.fx;state.last=r.cls;}
    else{on[i]=e.target.checked;state.last=on[i]?rowInfo(it,i).cls:null;}
    changed(it);});
  $('#next').onclick=()=>{const i=on.indexOf(false);if(i>-1){on[i]=true;state.last=rowInfo(it,i).cls;changed(it);const r=document.getElementById('r-'+i);r&&r.closest('.row').scrollIntoView({block:'nearest',behavior:'smooth'});}};
  $('#all').onclick=()=>{on.fill(true);state.last=null;changed(it);};
  $('#none').onclick=()=>{on.fill(false);state.last=null;changed(it);};

  document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{const c=b.dataset.practice;const s=PRACTICE.find(s=>s.items.some(x=>x.id===c));state.pset=s.key;state.pidx=s.items.findIndex(x=>x.id===c);state.pmsg=null;open('practice',true);});
  afterOpen(fromClick);
}
function renderRows(it){
  const on=onList(it);
  $('#rows').innerHTML=it.rows.map((r,i)=>{const x=rowInfo(it,i);
    const clsHTML=x.opts?`<select class="vsel" id="v-${i}" data-i="${i}" aria-label="Choose a class">${x.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===x.cls?'selected':''}>${esc(o[0])}</option>`).join('')}</select>`:esc(x.cls);
    return `<li><label class="row ${on[i]?'on':''}" for="r-${i}"><input type="checkbox" class="sw" id="r-${i}" data-i="${i}" ${on[i]?'checked':''}><span class="cls">${clsHTML}<span class="on-el">on &lt;${esc(elName(it,r[0]))}&gt;</span></span><span class="css">${esc(x.css)}</span><span class="fx">${esc(x.fx)}</span></label></li>`;}).join('');
  updateProgress(it);
}
function elName(it,key){const m=(it.html.match(new RegExp('<([\\w-]+)[^>]*class="\\{\\{'+key+'\\}\\}"'))||[])[1];return m||key;}
function updateProgress(it){const on=onList(it);const n=on.filter(Boolean).length;
  $('#progress').textContent=(n===0?'No classes added yet. Turn them on one by one.':`${n} of ${on.length} classes added.`)+(it.rows.some(r=>r[4])?' Rows with a dropdown let you try other values.':'');
  $('#next').disabled=n===on.length;
  document.querySelectorAll('#rows .row').forEach((r,i)=>r.classList.toggle('on',on[i]));
  document.querySelectorAll('#rows .sw').forEach((s,i)=>s.checked=on[i]);}
function updateCode(it){$('#code').innerHTML=hlHTML(fill(it,it.code||it.html),state.last);}
function changed(it){
  updateProgress(it);updateCode(it);
  const f=$('#pv');let d;try{d=f.contentDocument;}catch(e){}
  if(d&&d.body){d.body.innerHTML=withAssets(fill(it,it.html));setTimeout(()=>layoutFrame(f,$('#vp'),it.maxH),60);d.querySelectorAll('img').forEach(i=>i.addEventListener('load',()=>layoutFrame(f,$('#vp'),it.maxH)));}
  else f.srcdoc=docFor(fill(it,it.html));
}

/* ---------- CSS → Tailwind ---------- */
function openCheat(fromClick){
  state.id='cheat';try{history.replaceState(null,'','#cheat');}catch(e){}
  $('#main').innerHTML=`<div class="head"><div class="eyebrow">Lookup</div><h2>CSS → Tailwind</h2><p class="lead">You already know CSS. Type the CSS you want (like <code>padding</code> or <code>center</code>) or a Tailwind class (like <code>gap-4</code>) to find the match.</p></div>
  <section class="card"><input class="cheat-search" id="cq" type="search" placeholder="Type CSS or a class: padding, flex, hover, 768…" aria-label="Search the lookup table"><div class="tablewrap"><table class="cheat"><thead><tr><th>CSS</th><th>Tailwind class</th><th>Note</th></tr></thead><tbody id="cb"></tbody></table></div></section>`;
  const draw=q=>{q=q.trim().toLowerCase();let grp=null,out='';
    CHEAT.forEach(r=>{if(r.length===1){grp=r[0];return;}if(q&&!(r.join(' ')+' '+grp).toLowerCase().includes(q))return;
      if(grp){out+=`<tr class="grp"><td colspan="3">${esc(grp)}</td></tr>`;grp=null;}
      out+=`<tr><td class="m">${esc(r[0])}</td><td class="m tw">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`;});
    $('#cb').innerHTML=out||`<tr><td colspan="3">Nothing found for “${esc(q)}”. Try a shorter word.</td></tr>`;};
  draw('');$('#cq').addEventListener('input',e=>draw(e.target.value));
  afterOpen(fromClick);
}

  const r=el=>el?el.getBoundingClientRect():{left:0,right:0,top:0,bottom:0,width:0,height:0};
  const px=v=>parseFloat(v)||0;
  const inner=el=>{const b=r(el),s=cs(el);return {left:b.left+px(s.borderLeftWidth)+px(s.paddingLeft),right:b.right-px(s.borderRightWidth)-px(s.paddingRight),top:b.top+px(s.borderTopWidth)+px(s.paddingTop),bottom:b.bottom-px(s.borderBottomWidth)-px(s.paddingBottom)};};
  const c=x=>toRGB(x);
  const hsl=x=>{const [R,G,B,al]=c(x);const r=R/255,g=G/255,b=B/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;
    if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360;}
    return {h:hh,chroma:d*255,al};};
  const hueIn=(x,lo,hi,minC)=>{const o=hsl(x);return o.al>0&&o.chroma>=(minC||12)&&(lo<=hi?(o.h>=lo&&o.h<=hi):(o.h>=lo||o.h<=hi));};
  const isBlue=x=>hueIn(x,200,250,30);
  const isRed=x=>hueIn(x,340,15,8);
  const isGreen=x=>hueIn(x,85,175,8);
  const isOrange=x=>hueIn(x,14,50,60);
  const isWhite=x=>{const [a,g,b,al]=c(x);return al>200&&a>245&&g>245&&b>245;};
  const isGray=x=>{const [a,g,b,al]=c(x);return al>0&&Math.max(a,g,b)-Math.min(a,g,b)<45&&a+g+b>40&&a+g+b<700;};
  const alpha=x=>c(x)[3];
  const lum=x=>{const [a,g,b]=c(x);return (a+g+b)/3;};
  const flex=el=>/flex/.test(cs(el).display||'');
  const cols=el=>String(cs(el).gridTemplateColumns||'').trim().split(/\s+/).filter(x=>x&&x!=='none').map(px);
  return {q,qa,cs,r,px,inner,isBlue,isRed,isGreen,isOrange,isWhite,isGray,lum,flex,cols,alpha};
}
function renderAt(html,W){return new Promise(res=>{const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-same-origin');f.className='offscreen';f.style.width=W+'px';f.setAttribute('aria-hidden','true');f.tabIndex=-1;
  let done=false;const fin=()=>{if(done)return;done=true;setTimeout(()=>res(f),350);};f.onload=fin;setTimeout(fin,6000);f.srcdoc=docFor(html);document.body.appendChild(f);});}
function fnv(s){let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h;}
const normRoll=r=>String(r||'').toUpperCase().replace(/\s+/g,'');
function makeCode(roll,set,mask){const m=mask.toString(16).toUpperCase().padStart(2,'0');const h=fnv(`${normRoll(roll)}|${set}|${m}|fsd1-tagfinder-2026`).toString(36).toUpperCase().padStart(7,'0').slice(-5);return `${set}-${m}-${h}`;}
const setMask=s=>s.items.reduce((m,c,i)=>PS.solved[c.id]?m|(1<<i):m,0);
const solvedCount=s=>s.items.filter(c=>PS.solved[c.id]).length;

function navHTML(set){let out='',g=null;set.items.forEach((c,i)=>{if(c.grp!==g){if(g!==null)out+='</div></div>';g=c.grp;out+=`<div class="chgrp"><span class="chg">${esc(g||'')}</span><div class="chnums">`;}
  out+=`<button class="chn ${PS.solved[c.id]?'done':''}" data-ch="${i}" aria-current="${i===state.pidx}" aria-label="Challenge ${i+1}${PS.solved[c.id]?', solved':''}">${PS.solved[c.id]?'✓':i+1}</button>`;});return out+(g!==null?'</div></div>':'');}
function openPractice(fromClick){
  state.id='practice';try{history.replaceState(null,'','#practice');}catch(e){}
  const set=PRACTICE.find(s=>s.key===state.pset)||PRACTICE[0];if(state.pidx>=set.items.length)state.pidx=0;
  const ch=set.items[state.pidx];const work=PS.work[ch.id]??(HS+ch.start);
  const n=solvedCount(set),tot=set.items.length;
  const msg=state.pmsg&&state.pmsg.id===ch.id?state.pmsg:(PS.solved[ch.id]?{ok:true,text:'Solved. Move on to the next challenge.'}:null);
  $('#main').innerHTML=`
  <div class="head"><div class="eyebrow">Practice</div><h2>Practice &amp; get your completion code</h2>
    <p class="lead">Add Tailwind classes to make your result match the goal, then press <b>Check my answer</b>. When you finish a set, get your code and submit it to your teacher.</p></div>
  <section class="card who">
    <div class="field"><label for="p-name">Your name</label><input id="p-name" value="${esc(PS.name)}" autocomplete="name"></div>
    <div class="field"><label for="p-roll">Roll number</label><input id="p-roll" value="${esc(PS.roll)}"></div>
    <p class="hint">Your work is saved in this browser only.</p>
  </section>
  <div class="settabs" role="group" aria-label="Practice sets">${PRACTICE.map(s=>`<button class="settab ${s.pro?'pro':''}" data-set="${s.key}" aria-pressed="${s===set}">${esc(s.name)} <span class="cnt ${solvedCount(s)===s.items.length?'full':''}">${solvedCount(s)}/${s.items.length}</span></button>`).join('')}</div>
  ${set.pro?'<p class="pronote"><b>Optional.</b> Harder challenges for students who want more practice. Not compulsory.</p>':''}
  <div class="bench">
    <div class="col">
      <section class="card">
        <div class="chnav" role="group" aria-label="Challenges">${navHTML(set)}</div>
        <div class="eyebrow">${esc(ch.grp||'')}</div>
        <h3 class="ch-title">${state.pidx+1}. ${esc(ch.t)}</h3>
        <p class="task">${ch.task}</p>
        <label class="edl" for="p-editor">Your HTML (only add classes)</label>
        <textarea class="code" id="p-editor" spellcheck="false">${esc(work)}</textarea>
        <div class="pbtns"><button class="btn-p" id="p-check">Check my answer</button><button class="btn-s" id="p-hint">Hint</button><button class="btn-s" id="p-reset">Start again</button>${byId(ch.topic)?`<button class="btn-s" data-go="${ch.topic}">Learn: ${esc(byId(ch.topic).t)} →</button>`:''}</div>
        <div id="p-hinttext" class="hintbox" hidden><p style="margin:0">${esc(ch.hint)}</p><p id="p-hint2" style="margin:8px 0 0" hidden><b>Classes:</b> <code>${esc(ch.hint2||'')}</code></p></div>
        <div id="p-fb" class="fb ${msg?(msg.ok?'ok':'bad'):''}" aria-live="polite">${msg?(msg.ok?'✓ ':'✗ ')+esc(msg.text):''}</div>
        ${PS.solved[ch.id]&&state.pidx<tot-1?`<button class="btn-p" id="p-next" style="margin-top:10px">Next challenge →</button>`:''}
      </section>
    </div>
    <div class="col sticky">
      <div class="browser"><div class="bar"><span class="blabel goal">Goal</span><div class="url">what yours should look like</div>${devBar()}</div>
        <div class="vp" id="vp-goal"><iframe id="p-goal" sandbox="allow-scripts allow-same-origin" title="Goal"></iframe></div></div>
      <div class="browser"><div class="bar"><span class="blabel">Your result</span><div class="url">index.html</div></div>
        <div class="vp" id="vp-res"><iframe id="p-res" sandbox="allow-scripts allow-same-origin" title="Your result"></iframe></div>
        <p class="devnote">${devNote()}</p></div>
    </div>
  </div>
  <section class="card codecard">
    <h3 class="step-h">Completion code · ${esc(set.name)}</h3>
    <div class="pbar" role="img" aria-label="${n} of ${tot} solved"><i style="width:${Math.round(n/tot*100)}%"></i></div>
    <p class="hint">${n} of ${tot} challenges solved.${n<tot?' You can get a code now; it shows your score. Solve more and get a new code later.':' Well done, the set is complete.'}</p>
    <button class="btn-p" id="p-code" ${n?'':'disabled'}>Get my code</button>
    <div id="p-codeout"></div>
  </section>`;
  const ed=$('#p-editor');let t;
  const lay=()=>{layoutFrame($('#p-goal'),$('#vp-goal'),360);layoutFrame($('#p-res'),$('#vp-res'),360);};
  const goal=$('#p-goal');goal.onload=()=>{hook(goal);setTimeout(lay,150);setTimeout(lay,500);};goal.srcdoc=docFor(ch.sol);
  const res=$('#p-res');let loaded=false;res.onload=()=>{loaded=true;hook(res);setTimeout(lay,150);setTimeout(lay,500);};res.srcdoc=docFor(work);
  const upd=()=>{let d;try{d=res.contentDocument;}catch(e){}if(loaded&&d&&d.body){d.body.innerHTML=withAssets(ed.value);setTimeout(lay,80);}else res.srcdoc=docFor(ed.value);};
  ed.addEventListener('input',()=>{PS.work[ch.id]=ed.value;clearTimeout(t);t=setTimeout(()=>{psSave();upd();},250);});
  ed.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();ed.setRangeText('  ',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'));}});
  bindDevices(lay);
  $('#p-name').oninput=e=>{PS.name=e.target.value;psSave();};
  $('#p-roll').oninput=e=>{PS.roll=e.target.value;psSave();};
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{state.pset=b.dataset.set;state.pidx=0;state.pmsg=null;openPractice();});
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{state.pidx=+b.dataset.ch;state.pmsg=null;openPractice();});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go,true));
  $('#p-hint').onclick=()=>{const t=$('#p-hinttext'),t2=$('#p-hint2'),b=$('#p-hint');
    if(t.hidden){t.hidden=false;t2.hidden=true;b.textContent='Still stuck? Show the classes';}
    else if(t2.hidden){t2.hidden=false;b.textContent='Hide hint';}
    else{t.hidden=true;b.textContent='Hint';}};
  $('#p-reset').onclick=()=>{delete PS.work[ch.id];psSave();ed.value=HS+ch.start;upd();};
  if($('#p-next'))$('#p-next').onclick=()=>{state.pidx++;state.pmsg=null;openPractice();};
  $('#p-check').onclick=async()=>{
    PS.work[ch.id]=ed.value;psSave();const code=ed.value;const fb=$('#p-fb');
    if(/\sstyle\s*=|<style/i.test(code)){fb.className='fb bad';fb.textContent='✗ Use Tailwind classes only. Remove style="" and <style> from your code.';return;}
    fb.className='fb wait';fb.textContent='Checking…';$('#p-check').disabled=true;
    const frames=await Promise.all([renderAt(code,1100),renderAt(code,375),renderAt(code,700),renderAt(code,800)]);
    let out;try{const H={lg:mkHelpers(frames[0].contentDocument),phone:mkHelpers(frames[1].contentDocument),sm:mkHelpers(frames[2].contentDocument),md:mkHelpers(frames[3].contentDocument)};H.laptop=H.lg;out=ch.checks(H.lg,H);}catch(e){out=[[false,'Something in your code could not be checked. Look for a missing tag or quote.']];}
    frames.forEach(f=>f.remove());
    const fail=out.find(x=>!x[0]);
    if(fail){state.pmsg={id:ch.id,ok:false,text:fail[1]};fb.className='fb bad';fb.textContent='✗ '+fail[1];$('#p-check').disabled=false;}
    else{PS.solved[ch.id]=true;psSave();state.pmsg={id:ch.id,ok:true,text:'Correct! Well done.'};openPractice();}
  };
  $('#p-code').onclick=()=>{
    const out=$('#p-codeout');
    if(!PS.name.trim()||!normRoll(PS.roll)){out.innerHTML='<p class="fb bad">Type your name and roll number at the top first.</p>';$('#p-name').focus();return;}
    const code=makeCode(PS.roll,set.key,setMask(set));
    out.innerHTML=`<div class="codebox"><span class="codeval" id="codeval">${code}</span><button class="btn-s" id="copy-code">Copy</button></div>
      <p class="hint">${esc(PS.name)} · ${esc(normRoll(PS.roll))} · ${esc(set.name)} · ${n}/${tot} solved. Submit this code the way your teacher tells you. It only works with your own roll number.</p>`;
    $('#copy-code').onclick=()=>copy(code,$('#codeval'),'Code copied');
  };
  afterOpen(fromClick);
}

window.addEventListener('resize',()=>{if($('#pv'))layoutFrame($('#pv'),$('#vp'),(byId(state.id)||{}).maxH);if($('#p-goal')){layoutFrame($('#p-goal'),$('#vp-goal'),360);layoutFrame($('#p-res'),$('#vp-res'),360);}});
const start=(location.hash||'').slice(1);
renderTopics('');
open(byId(start)||['practice','cheat'].includes(start)?start:'how',false);
</script>

<script>
(function(){
  const KEY='hide-topics';const app=document.querySelector('.app'),b=document.getElementById('sidetoggle');
  const set=h=>{app.classList.toggle('noside',h);b.setAttribute('aria-expanded',String(!h));b.querySelector('span').textContent=h?'Show topics':'Hide topics';
    try{localStorage.setItem(KEY,h?'1':'0');}catch(e){}window.dispatchEvent(new Event('resize'));};
  let h=false;try{h=localStorage.getItem(KEY)==='1';}catch(e){}
  set(h);b.addEventListener('click',()=>set(!app.classList.contains('noside')));
